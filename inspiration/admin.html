<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>תצוגת הכרטיסים · נושמות השראה</title>
  <link rel="icon" href="../icon/favicon.png">
  <link rel="stylesheet" href="./inspiration.css">
</head>
<body data-page="card-gallery">
  <header class="masthead site-header">
    <a class="brand" href="../strongermenu-2026.html">
      <img class="brand-logo" src="../icon/logo.png" alt="לוגו פורצות דרך">
      <span><span class="eyebrow">פורצות דרך</span><strong>נושמות השראה</strong></span>
    </a>
    <a class="text-link" href="./teacher.html">חזרה לניהול המשחק</a>
  </header>
  <main id="app" class="dashboard gallery-page">
    <div class="gallery-header">
      <div>
        <p class="eyebrow">תצוגה מקדימה</p>
        <h1>כרטיסי הנשים</h1>
        <p id="gallery-count" aria-live="polite">טוענות את הכרטיסים…</p>
      </div>
      <label class="gallery-search">חיפוש כרטיס
        <input id="card-search" type="search" placeholder="חיפוש לפי שם או תחום" autocomplete="off">
      </label>
    </div>
    <section id="auth-panel" class="panel" aria-live="polite"><p>בודקות את ההתחברות…</p></section>
    <section id="gallery" class="gallery-grid" aria-label="כל כרטיסי הנשים" hidden></section>
    <p id="gallery-error" class="error-inline" role="alert" hidden></p>
  </main>
  <footer>פורצות דרך · תעשיידע</footer>
  <script type="module" src="./admin.js"></script>
</body>
</html>

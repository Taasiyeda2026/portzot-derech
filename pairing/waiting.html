<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="icon" type="image/png" href="../icon/favicon.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#ec4899">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="../icon/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
  <script src="../inspiration/vendor/supabase.js" defer></script>
  <title>ממתינות לחלוקה לקבוצה | פורצות דרך</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            font-size: 17px;
        }

        html,
        body {
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            zoom: 0.8;
            padding-top: 24px;
            padding-bottom: 24px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.2) 0%, transparent 70%);
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .container {
            text-align: center;
            color: white;
            z-index: 10;
            padding: 34px 20px;
            max-width: 600px;
            margin: 24px auto;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .message {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 40px;
            opacity: 0.95;
            line-height: 1.6;
        }

        .dots {
            display: inline-block;
            width: 60px;
            text-align: left;
        }

        .dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .stats {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 50px;
            display: inline-block;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            margin-top: 20px;
        }

        .stats-number {
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .stats-label {
            font-size: 20px;
            opacity: 0.9;
        }

        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 30px;
            opacity: 0.6;
            animation: float 10s ease-in infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .heart:nth-child(1) { left: 10%; animation-delay: 0s; }
        .heart:nth-child(2) { left: 25%; animation-delay: 2s; }
        .heart:nth-child(3) { left: 40%; animation-delay: 4s; }
        .heart:nth-child(4) { left: 55%; animation-delay: 1s; }
        .heart:nth-child(5) { left: 70%; animation-delay: 3s; }
        .heart:nth-child(6) { left: 85%; animation-delay: 5s; }

        /* מסך תוצאה */
        .waiting-screen {
            display: block;
            width: 100%;
        }

        .waiting-screen.hide {
            display: none;
        }

        .result-screen {
            display: none;
            width: 100%;
        }

        .result-screen.show {
            display: block;
        }

        .partner-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 36px 30px;
            max-width: 620px;
            margin: 20px auto 0;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.3);
        }

        .partner-name {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 700;
            margin: 25px 0;
            line-height: 1.3;
            word-break: normal;
            overflow-wrap: anywhere;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
            animation: slideIn 0.8s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .match-percent {
            font-size: 72px;
            font-weight: 700;
            color: #ffeb3b;
            margin: 25px 0;
            text-shadow: 0 4px 25px rgba(255,235,59,0.6);
            animation: popIn 0.6s ease 0.3s backwards;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .positive-message {
            font-size: 26px;
            line-height: 1.7;
            margin-top: 30px;
            opacity: 0.95;
            animation: fadeIn 0.8s ease 0.6s backwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 0.95;
            }
        }

        .team-badge {
            display: inline-block;
            background: rgba(255,193,7,0.3);
            border: 2px solid #ffc107;
            border-radius: 15px;
            padding: 12px 24px;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 25px;
            animation: slideIn 0.8s ease;
        }

        .team-members {
            font-size: 20px;
            margin-top: 20px;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
            }

            .message {
                font-size: 18px;
            }

            .icon {
                font-size: 60px;
            }

            .stats {
                padding: 20px 30px;
            }

            .stats-number {
                font-size: 48px;
            }

            .stats-label {
                font-size: 16px;
            }

            .partner-name {
                font-size: 36px;
            }

            .match-percent {
                font-size: 56px;
            }

            .positive-message {
                font-size: 20px;
            }

            .partner-card {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="hearts">
        <div class="heart">💕</div>
        <div class="heart">💖</div>
        <div class="heart">💗</div>
        <div class="heart">💓</div>
        <div class="heart">💝</div>
        <div class="heart">💞</div>
    </div>

    <div class="container">
        <!-- מסך המתנה -->
        <div class="waiting-screen" id="waitingScreen">
            <div class="icon">✨</div>
            <h1>תודה רבה! 🎉</h1>
            <div class="message">
                התשובות שלך נשמרו בהצלחה!<br>
                <strong>ממתינה לשאר המשתתפות<span class="dots"></span></strong>
            </div>

            <div class="stats">
                <div class="stats-number" id="completedCount">-</div>
                <div class="stats-label">התשובות שלך נשמרו</div>
            </div>

            <div class="message" style="margin-top: 40px; font-size: 18px; opacity: 0.8;">
                💝 המדריכה תפעיל חלוקה לקבוצות בקרוב
            </div>
        </div>

        <!-- מסך תוצאה -->
        <div class="result-screen" id="resultScreen">
            <div class="icon">💕</div>
            <h1 id="resultTitle">מצאנו לך קבוצה!</h1>
            
            <div class="partner-card">
                <div id="teamBadge" class="team-badge" style="display: none;">
                    👥 צוות של 3
                </div>
                
                <div class="message" style="margin-bottom: 10px;">
                    <span id="partnerLabel">הקבוצה שלך היא:</span>
                </div>
                
                <div class="partner-name" id="partnerName">...</div>
                
                <div id="teamMembers" class="team-members" style="display: none;"></div>
                
                
                
                <div class="positive-message" id="positiveMessage">...</div>
            </div>
        </div>
    </div>

    <script type="module">
import { api, code, credential, watchRoom } from './common.js';
const roomCode=code();
const arabic=new URLSearchParams(location.search).get('lang')==='ar';
const tr=(he,ar)=>arabic?ar:he;
if(arabic){
 document.documentElement.lang='ar';document.title='بانتظار تقسيم المجموعات | פורצות דרך';
 document.querySelector('#waitingScreen h1').textContent='شكرًا لكِ! 🎉';
 document.querySelector('#waitingScreen .message').innerHTML='تمّ حفظ إجاباتكِ بنجاح!<br><strong>بانتظار بقية المشاركات<span class="dots"></span></strong>';
 document.querySelector('.stats-label').textContent='تمّ حفظ إجاباتكِ';
 document.querySelector('#waitingScreen .message:last-child').textContent='💝 ستقسّم المرشدة المجموعات قريبًا';
 document.querySelector('#resultTitle').textContent='وجدنا لكِ مجموعة!';
 document.querySelector('#partnerLabel').textContent='مجموعتكِ هي:';
}
if(!/^[0-9a-f]{32}$/.test(roomCode)) location.replace('pairing.html?lang='+(arabic?'ar':'he'));
const token=credential(roomCode);
let stop;
async function refresh(){
 const data=await api('participant.state',{},token);
 if(!data.participant.completed&&!data.participant.manual){location.replace('questionnaire.html?room='+roomCode+'&lang='+(arabic?'ar':'he'));return;}
 document.getElementById('completedCount').textContent='✓';
 if(data.group){
  document.getElementById('waitingScreen').classList.add('hide');
  document.getElementById('resultScreen').classList.add('show');
  document.getElementById('partnerName').textContent=data.group.memberNames.join(' • ');
  document.getElementById('positiveMessage').textContent=tr('יש לכן בסיס טוב לעבודה משותפת. עכשיו תוכלו לחשוב יחד, לחלק תפקידים ולהתקדם לרעיון משותף.','لديكنّ أساس جيد للعمل معًا. الآن يمكنكُنّ التفكير معًا، وتوزيع الأدوار، والتقدّم نحو فكرة مشتركة.');
 }else if(data.room.phase==='closed'){
  document.querySelector('#waitingScreen .message').textContent=tr('הפעילות הסתיימה. פני למדריכה לקבלת הקבוצה שלך.','انتهى النشاط. توجّهي إلى المرشدة لمعرفة مجموعتكِ.');
 }
 return data;
}
const status=document.createElement('p');status.setAttribute('role','status');document.querySelector('.container').prepend(status);
let topic=null;
async function update(){
 try{
  const data=await refresh();status.textContent='';
  if(data&&data.room.topic!==topic){topic=data.room.topic;stop?.();stop=watchRoom(topic,update);}
 }catch(error){status.textContent=tr(error.message,'تعذّر الاتصال بالنشاط. تحقّقي من الاتصال أو توجّهي إلى المرشدة.');throw error;}
}
stop=watchRoom(null,update);
update().catch(()=>{});
window.addEventListener('pagehide',()=>stop?.());
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
      navigator.serviceWorker.register("../service-worker.js").catch(function(error) {
        console.error("Service worker registration failed:", error);
      });
    });
  }
</script>

</body>
</html>

name: Zod compatibility smoke test
on:
  push:
    branches: [security/zod-v4-compat-check-20261028]
  workflow_dispatch:
jobs:
  dependency-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate resolved Zod and Puppeteer imports
        run: |
          node -e "const z = require('zod'); if (!z.ZodError) process.exit(1); const p = require('puppeteer'); if (!p.launch) process.exit(1); console.log('Zod',require('zod/package.json').version,'Puppeteer import OK')"
          node -e "const c = require('chromium-bidi'); if (!c) process.exit(1); console.log('Chromium BiDi import OK')"
      - name: Headless Chromium CDP and BiDi smoke
        run: |
          node --input-type=module <<'EOF'
          import puppeteer from 'puppeteer';
          import { existsSync } from 'node:fs';
          const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(existsSync);
          if (!executablePath) throw new Error('System Chrome is unavailable on this runner');
          for (const protocol of ['cdp', 'webDriverBiDi']) {
            const browser = await puppeteer.launch({executablePath,headless:true,protocol,args:['--no-sandbox','--disable-setuid-sandbox']});
            try {
              const page = await browser.newPage();
              await page.goto('data:text/html,<title>zod-security-smoke</title><h1>OK</h1>');
              const title = await page.title();
              if (title !== 'zod-security-smoke') throw new Error(protocol+': unexpected title: '+title);
              console.log(protocol,'PASS');
            } finally { await browser.close(); }
          }
          EOF
      - name: Unit tests
        run: npm test

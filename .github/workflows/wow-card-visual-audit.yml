name: Verify new PNG WOW icon alignment
on:
  push:
    branches: [verify/wow-placement-new-cards-20261028]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Render actual card viewer and inspect new images
        run: |
          node --input-type=module <<'EOF'
          import {createServer} from 'node:http';
          import {readFile} from 'node:fs/promises';
          import {resolve,extname} from 'node:path';
          import puppeteer from 'puppeteer';
          const root=process.cwd();
          const mime={'.js':'text/javascript','.css':'text/css','.png':'image/png','.html':'text/html','.woff2':'font/woff2','.ttf':'font/ttf'};
          const server=createServer(async(req,res)=>{
            try{
              if(req.url==='/inspect'){
                res.writeHead(200,{'Content-Type':'text/html; charset=utf-8'});
                res.end(`<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/inspiration/inspiration.css"></head><body><main id="app" class="participant"></main><script type="module">
                import {cardViewer} from '/inspiration/common.js';
                const q=new URL(location.href).searchParams;const filename=q.get('image')||'joy.png';
                const old=fetch.bind(window);
                window.fetch=(url,opts)=>String(url).includes('supabase.co/functions/v1/inspiration-game')
                ? Promise.resolve(new Response(JSON.stringify({site_asset:filename}),{headers:{'Content-Type':'application/json'}}))
                :old(url,opts);
                const card={woman_name:filename,front_path:'site:women/'+filename,has_front:true,has_back:false};
                const v=cardViewer(card,'test-token');document.querySelector('#app').append(v.node);
                </script></body></html>`);return;
              }
              if(!req.url?.startsWith('/inspiration/')){res.writeHead(404);res.end();return;}
              const file=resolve(root,'.'+decodeURIComponent(req.url.split('?')[0]));
              if(!file.startsWith(resolve(root,'inspiration')+'/')){res.writeHead(403);res.end();return;}
              const data=await readFile(file);res.writeHead(200,{'Content-Type':mime[extname(file)]||'application/octet-stream'});res.end(data);
            }catch{res.writeHead(404);res.end();}
          });
          await new Promise(done=>server.listen(0,'127.0.0.1',done));
          const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          const base=`http://127.0.0.1:${server.address().port}/inspect`;
          try {
            const page=await browser.newPage();
            await page.setViewport({width:760,height:1150,deviceScaleFactor:1});
            for(const [i,name] of ['joy.png','Kylie.png','zahaa.png'].entries()){
              await page.goto(base+'?image='+encodeURIComponent(name));
              await page.waitForSelector('.wow-hit-area');
              await page.waitForFunction(()=>document.querySelector('.card-artwork img')?.naturalWidth>100);
              await new Promise(r=>setTimeout(r,750));
              const info=await page.evaluate(()=>{
                const im=document.querySelector('.card-artwork img'),art=document.querySelector('.card-artwork').getBoundingClientRect(),hit=document.querySelector('.wow-hit-area').getBoundingClientRect(),ico=document.querySelector('.wow-zoom-icon').getBoundingClientRect();
                return {file:im.alt,width:im.naturalWidth,height:im.naturalHeight,aspect:im.naturalWidth/im.naturalHeight,display:{x:art.x,y:art.y,w:art.width,h:art.height},
                hit:{leftPct:+((hit.left-art.left)/art.width*100).toFixed(2),topPct:+((hit.top-art.top)/art.height*100).toFixed(2),rightPct:+((art.right-hit.right)/art.width*100).toFixed(2),bottomPct:+((art.bottom-hit.bottom)/art.height*100).toFixed(2),w:hit.width,h:hit.height},icon:{leftPct:+((ico.left-art.left)/art.width*100).toFixed(2),topPct:+((ico.top-art.top)/art.height*100).toFixed(2)}};
              });
              console.log('GEOMETRY_'+i+'='+JSON.stringify(info));
              if(i<2){
                const screenshot=await page.screenshot({type:'jpeg',quality:58});
                console.log('VISUAL_'+i+'_BASE64='+screenshot.toString('base64'));
              }
            }
          }finally{await browser.close();await new Promise(done=>server.close(done));}
          EOF

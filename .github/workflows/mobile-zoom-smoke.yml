name: Test mobile zoom controls
on:
  push:
    branches: [fix/inspiration-mobile-zoom-controls-20261028]
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regression tests
        run: node --test inspiration/tests/mobile-zoom-controls.test.mjs inspiration/tests/wow-overlay.test.mjs
      - name: Chromium mobile and desktop geometry and interaction
        run: |
          node --input-type=module <<'EOF'
          import {createServer} from 'node:http';
          import {readFile} from 'node:fs/promises';
          import {resolve,extname} from 'node:path';
          import assert from 'node:assert/strict';
          import puppeteer from 'puppeteer';
          const root=process.cwd();
          const mime={'.js':'text/javascript','.css':'text/css','.png':'image/png'};
          const server=createServer(async(req,res)=>{
            try{
              if(req.url?.startsWith('/smoke')){
                res.writeHead(200,{'Content-Type':'text/html; charset=utf-8'});
                res.end(`<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/inspiration/inspiration.css"></head><body><main id="app" class="participant"></main><script type="module">
                  import {cardViewer} from '/inspiration/common.js';
                  const old=fetch.bind(window);
                  window.fetch=(url,options)=>String(url).includes('supabase.co/functions/v1/inspiration-game')
                    ? Promise.resolve(new Response(JSON.stringify({site_asset:'ada.png'}),{headers:{'Content-Type':'application/json'}}))
                    :old(url,options);
                  const card={woman_name:'עדה לאבלייס',has_front:true,has_back:false};
                  const viewer=cardViewer(card,'test-token');
                  document.querySelector('#app').append(viewer.node);
                  </script></body></html>`);return;
              }
              if(!req.url?.startsWith('/inspiration/')){res.writeHead(404);res.end();return;}
              const file=resolve(root,'.'+decodeURIComponent(req.url.split('?')[0]));
              if(!file.startsWith(resolve(root,'inspiration')+'/')){res.writeHead(403);res.end();return;}
              const data=await readFile(file);res.writeHead(200,{'Content-Type':mime[extname(file)]||'application/octet-stream'});res.end(data);
            }catch{res.writeHead(404);res.end();}
          });
          await new Promise(ok=>server.listen(0,'127.0.0.1',ok));
          const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          try{
            const page=await browser.newPage();
            for (const width of [360,390,1200]){
              await page.setViewport({width,height:844,deviceScaleFactor:1});
              await page.goto(`http://127.0.0.1:${server.address().port}/smoke`);
              await page.waitForSelector('.wow-hit-area');
              await page.waitForFunction(()=>document.querySelector('.card-artwork img')?.naturalWidth>0);
              await new Promise(r=>setTimeout(r,700));
              const icon=await page.$eval('.wow-zoom-icon',e=>{
                const r=e.getBoundingClientRect(),button=e.closest('button').getBoundingClientRect();
                return {w:r.width,h:r.height,tapW:button.width,tapH:button.height};
              });
              assert.ok(icon.tapW>=44&&icon.tapH>=44);
              assert.equal(icon.w,width<761?20:30);
              console.log('ICON',width,JSON.stringify(icon));
              await page.$eval('.viewer-controls',e=>[...e.querySelectorAll('button')].find(b=>b.textContent.includes('הגדלת הקלף'))?.click());
              await page.waitForSelector('.media-zoom[open]');
              const geometry=await page.evaluate(()=>{
                const d=document.querySelector('.media-zoom').getBoundingClientRect();
                const b=document.querySelector('.media-zoom .actions button').getBoundingClientRect();
                const i=document.querySelector('.media-zoom img').getBoundingClientRect();
                return {dialogW:d.width,buttonW:b.width,buttonH:b.height,closeAtRight:d.right-b.right,imageW:i.width,buttonLabel:document.querySelector('.media-zoom .actions button').textContent};
              });
              if(width<761){
                assert.ok(geometry.buttonW<130,JSON.stringify(geometry));
                assert.ok(geometry.closeAtRight<30,JSON.stringify(geometry));
                assert.ok(geometry.imageW<geometry.dialogW,JSON.stringify(geometry));
              }
              console.log('FULL_CARD_ZOOM',width,JSON.stringify(geometry));
              await page.click('.media-zoom .actions button');
              await page.waitForFunction(()=>!document.querySelector('.media-zoom[open]'));
              await page.click('.wow-hit-area');
              await page.waitForSelector('.wow-modal[open]');
              await page.click('.wow-modal-close');
              await page.waitForFunction(()=>!document.querySelector('.wow-modal[open]'));
              console.log('WOW opens/closes',width);
            }
          } finally {await browser.close();await new Promise(ok=>server.close(ok));}
          EOF

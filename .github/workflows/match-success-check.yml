name: Verify matching success acknowledgment
on:
  push:
    branches: [feature/inspiration-match-success-20261028]
jobs:
  match-success-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Focused matching tests
        run: node --test inspiration/tests/match-success.test.mjs inspiration/tests/independent-matching-flow.test.mjs
      - name: Real browser verifies success only for valid matching
        run: |
          node --input-type=module <<'EOF'
          import {createServer} from 'node:http';
          import {readFile} from 'node:fs/promises';
          import {resolve,extname} from 'node:path';
          import assert from 'node:assert/strict';
          import puppeteer from 'puppeteer';
          const root=process.cwd();
          const html=`<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/inspiration/inspiration.css"></head><body><div id="connection"></div><main id="app"></main><div id="notice" class="notice" role="alert" hidden></div>
          <script>
            localStorage.setItem('inspiration:participant:TEST',JSON.stringify({token:'test-token'}));
            window.__verified=false;window.__allowMatch=false;
            window.fetch=(url,opts)=>{
              const request=JSON.parse(opts?.body||'{}');
              const state={
                room:{id:'demo-room',phase:'matching',expected:2},
                player:{name:'Test',card:{number:1,woman_name:'ג׳וי בולאמוויני',field:'AI',has_front:true,has_back:false,front_path:'site:women/joy.png'}},
                progress:{verified:window.__verified,confirmed:false,group_size:2,hint:'רמז לדוגמה'},
                taken:[1,2]
              };
              const json=(body,status=200)=>new Response(JSON.stringify(body),{status,headers:{'Content-Type':'application/json'}});
              if(request.action==='participant.state')return Promise.resolve(json(state));
              if(request.action==='participant.asset')return Promise.resolve(json({site_asset:'joy.png'}));
              if(request.action==='participant.verify_match'){
                if(!window.__allowMatch)return Promise.resolve(json({error:{message:'MATCH_INCORRECT'}},400));
                window.__verified=true;state.progress.verified=true;return Promise.resolve(json(state));
              }
              return Promise.resolve(json({error:{message:'Unexpected action'}},400));
            };
          </script>
          <script type="module" src="/inspiration/participant.js"></script></body></html>`;
          const mime={'.js':'text/javascript','.css':'text/css','.png':'image/png'};
          const server=createServer(async(req,res)=>{
            try{
              if(req.url==='/smoke'){res.writeHead(200,{'Content-Type':'text/html; charset=utf-8'});res.end(html);return;}
              if(!req.url?.startsWith('/inspiration/')){res.writeHead(404);res.end();return;}
              const file=resolve(root,'.'+decodeURIComponent(req.url));
              if(!file.startsWith(resolve(root,'inspiration')+'/')){res.writeHead(403);res.end();return;}
              const data=await readFile(file);res.writeHead(200,{'Content-Type':mime[extname(file)]||'application/octet-stream'});res.end(data);
            }catch{res.writeHead(404);res.end();}
          });
          await new Promise(ok=>server.listen(0,'127.0.0.1',ok));
          const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          try{
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844});
            await page.goto(`http://127.0.0.1:${server.address().port}/smoke`);
            await page.waitForSelector('.match-form input');
            await page.type('.match-form input','2');
            await page.click('.match-form button[type=submit]');
            await page.waitForFunction(()=>document.querySelector('#notice')?.textContent.includes('המספרים אינם תואמים'));
            assert.equal(await page.$('.match-success-moment'),null,'no success on incorrect match');
            console.log('INCORRECT MATCH: no success animation PASS');
            await page.evaluate(()=>{window.__allowMatch=true;});
            await page.click('.match-form button[type=submit]');
            await page.waitForSelector('.hint-panel');
            await page.waitForSelector('.match-success-moment');
            const status=await page.$eval('.match-success-moment',el=>({text:el.innerText,nonBlocking:getComputedStyle(el).pointerEvents==='none'}));
            assert.match(status.text,/מצאתן את החיבור!/);
            assert.ok(status.nonBlocking);
            console.log('VERIFIED MATCH: compact animation PASS');
            await page.waitForFunction(()=>!document.querySelector('.match-success-moment'),{timeout:5000});
            await page.evaluate(()=>window.dispatchEvent(new Event('online')));
            await new Promise(ok=>setTimeout(ok,400));
            assert.equal(await page.$('.match-success-moment'),null,'no animation on refresh');
            console.log('STATE REFRESH: no repeated animation PASS');
          }finally{await browser.close();await new Promise(ok=>server.close(ok));}
          EOF

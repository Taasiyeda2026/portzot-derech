name: Verify RTL card number desktop mobile
on:
  push:
    branches: [fix/inspiration-ada-name-card-number-20261028]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit checks
        run: node --test inspiration/tests/card-number-rtl.test.mjs inspiration/tests/wow-overlay.test.mjs inspiration/tests/mobile-zoom-controls.test.mjs
      - name: Browser card number placement
        run: |
          node --input-type=module <<'EOF'
          import {createServer} from 'node:http';
          import {readFile} from 'node:fs/promises';
          import {resolve,extname} from 'node:path';
          import assert from 'node:assert/strict';
          import puppeteer from 'puppeteer';
          const root=process.cwd();
          const server=createServer(async(req,res)=>{
            try{
              if(req.url?.startsWith('/smoke')){
                const mode=new URL('http://localhost'+req.url).searchParams.get('mode')||'selected';
                res.writeHead(200,{'Content-Type':'text/html; charset=utf-8'});
                res.end(`<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/inspiration/inspiration.css"></head><body><div id="connection"></div><main id="app" class="participant"></main><div id="notice"></div>
                <script>
                  history.replaceState(null,'','/smoke?code=TEST&mode=${mode}');
                  localStorage.setItem('inspiration:participant:TEST',JSON.stringify({token:'test-token'}));
                  const originalFetch=window.fetch.bind(window);
                  window.fetch=(url,opts)=>{
                    if(String(url).includes('/functions/v1/inspiration-game')){
                      const req=JSON.parse(opts?.body||'{}');
                      const selected=${JSON.stringify(mode)}==='selected';
                      const answer=req.action==='participant.state'
                      ?{room:{id:'sample-room',phase:selected?'matching':'choosing',expected:6},player:{name:'נועה',card:selected?{number:17,woman_name:'אדה לאבלייס',field:'מחשבים ומתמטיקה',has_front:true,has_back:false}:null},progress:{verified:false,confirmed:false,group_size:2},taken:[]}
                      :req.action==='participant.asset'?{site_asset:'ada.png'}:{error:{message:'unexpected action'}};
                      return Promise.resolve(new Response(JSON.stringify(answer),{headers:{'Content-Type':'application/json'}}));
                    }
                    return originalFetch(url,opts);
                  };
                </script><script type="module" src="/inspiration/participant.js"></script></body></html>`);return;
              }
              if(!req.url?.startsWith('/inspiration/')){res.writeHead(404);res.end();return;}
              const path=resolve(root,'.'+decodeURIComponent(req.url.split('?')[0]));
              if(!path.startsWith(resolve(root,'inspiration')+'/')){res.writeHead(403);res.end();return;}
              const data=await readFile(path);
              const mime={'.js':'text/javascript','.css':'text/css','.png':'image/png'};
              res.writeHead(200,{'Content-Type':mime[extname(path)]||'application/octet-stream'});res.end(data);
            }catch{res.writeHead(404);res.end();}
          });
          await new Promise(done=>server.listen(0,'127.0.0.1',done));
          const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
          try{
            const page=await browser.newPage();
            for (const width of [390,1200]){
              await page.setViewport({width,height:900});
              await page.goto(`http://127.0.0.1:${server.address().port}/smoke?mode=selected`);
              await page.waitForSelector('.personal-card-number-value');
              const data=await page.evaluate(()=>{
                const num=document.querySelector('.personal-card-number-value');
                const label=document.querySelector('.personal-card-number-label');
                const p=num.parentElement;
                return {num:num.textContent,label:label.textContent,woman:document.querySelector('.personal-header h2')?.textContent,
                  direction:getComputedStyle(p).direction,numberDir:num.dir,numberFont:parseFloat(getComputedStyle(num).fontSize),
                  rightEdge:num.getBoundingClientRect().right,labelRight:label.getBoundingClientRect().right};
              });
              assert.equal(data.woman,'אדה לאבלייס');
              assert.equal(data.num,'17');
              assert.equal(data.direction,'rtl');assert.equal(data.numberDir,'ltr');
              assert.ok(data.rightEdge>data.labelRight,'number must be right of its label');
              assert.ok(data.numberFont>=32,'number too small');
              console.log('PERSONAL_HEADER_PASS',width,JSON.stringify(data));
              await page.goto(`http://127.0.0.1:${server.address().port}/smoke?mode=choosing`);
              await page.waitForSelector('.card-back .card-number');
              const board=await page.$eval('.card-back .card-number',e=>({number:e.textContent,font:parseFloat(getComputedStyle(e).fontSize)}));
              assert.ok(board.font>=44,JSON.stringify(board));
              console.log('SELECTION_NUMBER_PASS',width,JSON.stringify(board));
            }
          }finally{await browser.close();await new Promise(done=>server.close(done));}
          EOF

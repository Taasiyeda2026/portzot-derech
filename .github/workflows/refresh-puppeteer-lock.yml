name: Refresh Puppeteer lockfile

on:
  push:
    branches:
      - security/update-puppeteer-25-12-0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/update-puppeteer-25-12-0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Refresh package lock
        run: npm install puppeteer@25.12.0 --package-lock-only --ignore-scripts

      - name: Install dependencies without browser download
        run: npm ci --ignore-scripts

      - name: Validate Node server syntax and Puppeteer package
        run: |
          node --check server.js
          node -e "console.log('Puppeteer', require('puppeteer/package.json').version)"

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): refresh lockfile for Puppeteer 25.12.0"
          git push origin HEAD:security/update-puppeteer-25-12-0

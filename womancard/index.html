.station:not(:last-child):after{content:"➤";position:absolute;direction:ltr;right:-3.8mm;top:50%;transform:translateY(-50%);width:3.1mm;text-align:center;font:700 12px/1 Arial,sans-serif;color:#1c5688;text-shadow:0 0 .4px #193951;pointer-events:none}

[hidden]{display:none!important}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:static;max-height:none}.card{transform:scale(.85);transform-origin:top center}.stage{min-height:650px}.top{flex-wrap:wrap}}

@media print{@page{size:120mm 180mm;margin:0}html,body{margin:0!important;padding:0!important;background:#fff!important}.top,.shell{display:none!important}#printArea{position:static!important;left:auto!important;visibility:visible!important;pointer-events:auto!important}.card{margin:0!important;box-shadow:none!important;break-inside:avoid-page;page-break-inside:avoid}.card:last-child{page-break-after:auto;break-after:auto}}

/* Unified typography: title, line-height and letter spacing fixed across the set. */
.card{--tracking:.15em;--bg-size:100% 100%}
.card:before{opacity:1!important;background-size:100% 100%!important}
.card .name{font-size:24px;line-height:1.3;font-weight:700;letter-spacing:var(--tracking);height:14mm;min-height:14mm;max-height:14mm;overflow:hidden;text-shadow:0 1px 0 rgba(255,255,255,.25),0 2px 0 #184c79,0 4px 0 #123451,0 6px 9px rgba(0,20,49,.65);-webkit-text-stroke:.15px rgba(5,39,70,.2)}

<body>
<header class="top"><div><h1>womancard <span style="font-weight:400;color:#6d8da5">/ נושמות השראה</span></h1></div></header>
<div class="shell">
<aside class="panel sidebar">
<h2>נתונים</h2>
<label for="excel">ייבוא קובץ</label><input id="excel" type="file" accept=".xlsx,.xls,.csv,.json" hidden><button id="chooseExcel" type="button" class="primary" style="width:100%;margin-top:7px">בחירת Excel / CSV / JSON</button><div id="importReport" class="import-report" role="status" aria-live="polite"></div>

<div class="grid2"><button id="save">שמירת JSON</button><button id="clear">ניקוי נתונים</button></div>
<label for="lang">שפת הכרטיסים</label><select id="lang"><option value="he">עברית</option><option value="ar">العربية</option></select><label for="which">בחירת אישה</label><select id="which"></select>
<div class="grid2" style="margin-top:10px"><button id="printOne" class="primary">הדפסת כרטיס</button><button id="printAll" class="primary">הדפסת הכול</button></div>
<div class="block"><h2>עיצוב</h2>
<label for="bgScope">החלת רקע</label><select id="bgScope"><option value="all">כל הכרטיסים</option><option value="one">הכרטיס הנוכחי בלבד</option></select><label for="bg">רקע הכרטיס</label><input id="bg" type="file" accept="image/*">
<label for="theme">משפחת צבע</label><select id="theme"><option value="tech">כחול · טכנולוגיה ו־AI</option><option value="science">ירוק · מדע ורפואה</option><option value="space">סגול · חלל ומתמטיקה</option><option value="culture">ורוד־אדום · תרבות</option><option value="social">זהב · חברה והשפעה</option><option value="sport">כתום · ספורט</option><option value="design">צהוב · עיצוב</option><option value="finance">שמפניה · פיננסים</option></select>
<label>גופנים</label>
<div class="grid2"><div><label for="fTitle">שם וכותרת</label><select id="fTitle"></select></div><div><label for="fBody">ביוגרפיה</label><select id="fBody"></select></div><div><label for="fTime">ציר הזמן</label><select id="fTime"></select></div><div><label for="fLink">משפט מחבר</label><select id="fLink"></select></div></div>
<label for="fontFile">העלאת גופן אישי</label><input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2">
<label for="bodySize">גודל טקסט גוף</label><input id="bodySize" type="range" min="8" max="14" step=".25" value="10"><label for="tracking">ריווח אותיות · <span id="trackingValue">15</span></label><input id="tracking" type="range" min="0" max="30" step="1" value="15">
</div>
<div class="block" id="secretPanel">
<h2>סימן סודי</h2>
<p class="hint" id="pairMembers"></p>
<label for="pairId">מזהה קבוצה</label><input id="pairId" type="text" placeholder="לדוגמה: Z01">
<label for="secretIcon">סמל הקבוצה</label><input id="secretIcon" type="file" accept=".png,.webp,.svg,image/png,image/webp,image/svg+xml">
<div class="grid2"><button id="removeSecret" type="button">הסרת סמל מהקבוצה</button><span class="hint" id="secretState" style="align-self:center">לא הוגדר סמל</span></div>
<label for="secretSize">גודל · <span id="secretSizeValue">9 מ״מ</span></label><input id="secretSize" type="range" min="5" max="18" step="1" value="9">
<div class="grid2"><div><label for="secretX">מיקום אופקי · <span id="secretXValue">8%</span></label><input id="secretX" type="range" min="5" max="95" step="1" value="8"></div><div><label for="secretY">מיקום אנכי · <span id="secretYValue">91%</span></label><input id="secretY" type="range" min="5" max="95" step="1" value="91"></div></div>

</div>
<div class="block"><h2>עריכת כרטיס</h2>
<label>שם האישה</label><input id="name" type="text">
<label>תחום</label><input id="field" type="text">
<label>ציר זמן</label><div id="timelineEditor"></div>
<label>פתיחה</label><textarea id="intro" rows="4"></textarea>
<label>פריצת הדרך</label><textarea id="breakthrough"></textarea>
<label>האתגרים בדרך</label><textarea id="challenges"></textarea>
<label>מה עשתה אחרת?</label><textarea id="different"></textarea>
<label>ההשפעה שלה</label><textarea id="impact"></textarea>
<label>רגע, באמת?!</label><textarea id="surprise"></textarea>
<label>משפט מחבר</label><textarea id="connection"></textarea>
</div>
<p class="status" id="status" role="status" aria-live="polite"></p>
</aside>
<main class="panel stage"><div class="stagehead"><span id="counter">תצוגת כרטיס</span><span>12×18 ס״מ</span></div><div class="paper" id="preview"></div><p class="hint" id="warn" role="alert"></p></main>
</div>
<div id="printArea" aria-hidden="true"></div>

<script>
(function(){
'use strict';
var FONT_LIST=['IBM','IBM Light','IBM Medium','IBM SemiBold','IBM ExtraLight','Alef','Arimo','Arimo Medium','Arimo SemiBold','Choco','Dana','Gveret','PilKahol','Yehuda','Alice','Lora'];
var language='he',collections={he:[],ar:[]},records=collections.he,index=0,sharedBg='',perBg={},uploadedFont='',fontSel={title:'Choco',body:'IBM',time:'IBM',link:'Choco'},bodySize=10,tracking=15,secretIcons={},secretPosition={x:8,y:91,size:9};
var $=function(id){return document.getElementById(id)};
var importInfoByLang={he:null,ar:null};
function importInfo(msg,kind){var box=$('importReport');box.textContent=msg;box.className='import-report'+(kind?' '+kind:'')}
function updateImportInfo(){
 var obj=importInfoByLang[language];
 if(obj&&records.length){importInfo('✓ '+records.length+' נשים · '+obj.file,'success')}
 else if(records.length){importInfo('✓ '+records.length+' נשים טעונות','success')}
 else {importInfo('')}
}
var editFields=['name','field','intro','breakthrough','challenges','different','impact','surprise','connection'];
var demo={name:'כרטיס לדוגמה',field:'פורצת דרך',intro:'ייבאי Excel כדי לטעון את נתוני 63 הנשים. כאן תוצג פסקת הפתיחה המלאה.',breakthrough:'כאן תופיע פריצת הדרך.',challenges:'כאן יופיעו האתגרים בדרך.',different:'כאן יופיע מה עשתה אחרת.',impact:'כאן תופיע ההשפעה שלה.',surprise:'כאן יופיע פרט מסקרן.',connection:'כאן יופיע המשפט המחבר בלבד.',theme:'tech',timeline:[{year:'2016',text:'אירוע מרכזי ראשון'},{year:'2018',text:'נקודת מפנה נוספת'},{year:'2020',text:'הישג משמעותי'},{year:'2023',text:'ציון דרך אחרון'}]};
var statusTimeout=null;
function status(s,error){
 var el=$('status');el.textContent=s||'';el.className='status'+(error?' warn':'');
 if(statusTimeout)clearTimeout(statusTimeout);
 if(s&&!error)statusTimeout=setTimeout(function(){if(el.textContent===s)el.textContent=''},4800)
}
function clean(s){return String(s==null?'':s).replace(/^\s*(המכנה המשותף\s*:|القاسم المشترك\s*:)\s*/i,'').trim()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function current(){return records[index]||demo}
function get(p,k){return p&&p[k]||''}

async function compactSymbol(file){
  if(file.size>3*1024*1024)throw Error('בחרו סמל קטן מ־3MB');
  if(!/^(image\/(png|webp|svg\+xml))$/.test(file.type)&&!/\.(png|webp|svg)$/i.test(file.name))throw Error('פורמטים מותרים: PNG, WebP, SVG');

  var im=new Image();await new Promise(function(resolve,reject){im.onload=resolve;im.onerror=function(){reject(Error('תמונת הסמל אינה תקינה'))};im.src=raw});
  var ratio=Math.min(1,320/Math.max(im.naturalWidth||1,im.naturalHeight||1)),canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(im.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(im.naturalHeight*ratio));
  canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);
  var out=canvas.toDataURL('image/webp',.94);return out.startsWith('data:image/webp')?out:canvas.toDataURL('image/png')
}

$('excel').onchange=async function(e){
 var file=e.target.files[0];if(!file)return;
 importInfo('קורא את הקובץ "'+file.name+'"…');
 try{
  var loaded,sourceSheet='';
  if(/\.json$/i.test(file.name)){
   var obj=JSON.parse(await file.text());
   loaded=Array.isArray(obj)?obj:(obj.records||[]);
   if(!Array.isArray(loaded)&&loaded.he)loaded=loaded.he;
   if(obj.secretSymbols&&obj.secretSymbols.icons){
    secretIcons=Object.assign({},secretIcons,obj.secretSymbols.icons);
    if(obj.secretSymbols.position){
     secretPosition=Object.assign(secretPosition,obj.secretSymbols.position);
     [['secretSize','size',' מ״מ'],['secretX','x','%'],['secretY','y','%']].forEach(function(a){$(a[0]).value=secretPosition[a[1]];$(a[0]+'Value').textContent=secretPosition[a[1]]+a[2]})
    }
    saveSecretSettings()
   }
   if(!Array.isArray(loaded))throw Error('קובץ JSON אינו מכיל רשימת נשים תקינה.');
  }else{
   if(!window.XLSX)throw Error('לא הצלחנו לטעון את מנוע קריאת Excel. בדקו חיבור לאינטרנט ורעננו את העמוד.');
   var workbook=XLSX.read(await file.arrayBuffer(),{type:'array'});
   var best=null;
   workbook.SheetNames.forEach(function(name){
    var rows=XLSX.utils.sheet_to_json(workbook.Sheets[name],{defval:'',raw:false});
    if(!rows.length)return;
    var header=Object.keys(rows[0]).map(function(k){return k.trim().replace(/^\uFEFF/,'')});
    if(!header.some(function(k){return ['שם האישה','שם','name','اسم المرأة'].includes(k)}))return;
    var parsed=rows.map(parseRow).filter(function(r){return r.name&&r.name.trim()});
    if(!parsed.length)return;
    var details=parsed.filter(function(p){return p.intro||p.breakthrough||p.timeline.some(function(t){return t.year||t.text})}).length;
    var score=details*10+parsed.length;
    if(!best||score>best.score)best={parsed:parsed,sheet:name,score:score};
   });
   if(!best)throw Error('לא זוהתה לשונית המכילה עמודה "שם האישה" ונתונים. ודאו שהכותרות מופיעות בשורה הראשונה.');
   loaded=best.parsed;sourceSheet=best.sheet;
  }
  if(!Array.isArray(loaded)||loaded.length===0)throw Error('הקובץ לא מכיל רשומות תקינות עם שם אישה.');
  var valid=loaded.map(norm).filter(function(r){return r.name&&r.name.trim()});

  records=valid;collections[language]=records;index=0;
  sync();
  var date=new Date();
  var meta={file:file.name,sheet:sourceSheet,count:records.length,loadedAt:date.toLocaleString('he-IL')};
  importInfoByLang[language]=meta;
  try{localStorage.setItem('womancard-import-meta-v1-'+language,JSON.stringify(meta))}catch(err){}
  bindEdit();
  status('');
 }catch(err){
  importInfo('שגיאה בייבוא "'+file.name+'": '+err.message+' הנתונים שהיו במערכת נשמרו ללא שינוי.','error');
  status('הייבוא נכשל: '+err.message,true);
 }finally{
  e.target.value='';

};

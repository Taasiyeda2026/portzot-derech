<!DOCTYPE html>

<head>

      <span class="course-lang-switch" aria-label="اختيار اللغة">

        <span class="lang-separator" aria-hidden="true"> | </span>
        <a href="management.html?lang=ar" lang="ar" data-course-language="ar" aria-current="true">العربية</a>
      </span>
    </nav>
    <h1 class="management-title">واجهة الإدارة</h1>
    <section class="management-activities" aria-label="أنشطة الإدارة">
      <button class="menu-item management-activity" type="button" disabled data-activity="inspiration" data-activity-url="../inspiration/teacher.html?lang=ar">

        <p>لعبة البطاقات الجماعية</p>

      <button class="management-login" id="management-login" type="button">تسجيل الدخول عبر لوحة تحكم تَعشايَدا</button>

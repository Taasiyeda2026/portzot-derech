<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="../../js/course-language.js"></script>

  <link rel="icon" type="image/png" href="../../icon/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="../../manifest.json">
  <meta name="theme-color" content="#ec4899">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="../../icon/favicon.png">
    <title>إدارة النشاط - رائدات الطريق</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            font-size: 17px;
        }

        html,
        body {
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            position: relative;
            zoom: 0.8;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,20,147,0.15) 0%, transparent 70%);
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #ff1493;
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 0 40px rgba(255,20,147,0.3),
                        inset 0 0 60px rgba(255,20,147,0.05);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
                transparent 30%,
                rgba(255,20,147,0.1) 50%,
                transparent 70%);
            animation: rotate 8s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            color: #ff1493;
            text-shadow: 0 0 20px rgba(255,20,147,0.7);
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
            z-index: 2;
        }

        label {
            display: block;
            color: #ff69b4;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #ff1493;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #ff69b4;
            box-shadow: 0 0 15px rgba(255,20,147,0.5);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,20,147,0.4);
            position: relative;
            z-index: 2;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,20,147,0.6);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tracking-screen {
            display: none;
        }

        .tracking-screen.active {
            display: block;
        }

        .stats {
            text-align: center;
            margin: 30px 0;
            position: relative;
            z-index: 2;
        }

        .stats h2 {
            color: #ff1493;
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,20,147,0.7);
        }

        .progress-container {
            width: 100%;
            height: 20px;
            background: rgba(255,20,147,0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff1493, #ff69b4);
            transition: width 0.5s ease;
            box-shadow: 0 0 10px #ff1493;
        }

        .timer {
            color: #ff69b4;
            margin-top: 10px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }

        .secondary-btn {
            background: rgba(255,20,147,0.2);
            border: 1px solid #ff1493;
        }

        .success-message {
            background: rgba(0,255,100,0.2);
            border: 1px solid #00ff64;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            color: #00ff64;
            text-align: center;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .error {
            background: rgba(255,50,50,0.2);
            border: 1px solid #ff3232;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            color: #ff6b6b;
            display: none;
        }

        .error.show {
            display: block;
        }

        /* שעון עצר */
        .stopwatch-container {
            background: linear-gradient(135deg, rgba(255,20,147,0.2), rgba(255,105,180,0.1));
            border: 2px solid #ff1493;
            border-radius: 20px;
            padding: 24px;
            margin: 20px 0;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255,20,147,0.4),
                        inset 0 0 30px rgba(255,20,147,0.1);
        }

        .stopwatch-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
                transparent 30%,
                rgba(255,20,147,0.15) 50%,
                transparent 70%);
            animation: rotate 6s linear infinite;
        }

        .stopwatch-label {
            color: #ff69b4;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
            text-shadow: 0 0 10px rgba(255,20,147,0.5);
        }

        .stopwatch-display {
            font-size: 48px;
            font-weight: 700;
            color: #ff1493;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255,20,147,0.8),
                         0 0 40px rgba(255,20,147,0.5);
            position: relative;
            z-index: 2;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                text-shadow: 0 0 20px rgba(255,20,147,0.8),
                             0 0 40px rgba(255,20,147,0.5);
            }
            50% {
                text-shadow: 0 0 30px rgba(255,20,147,1),
                             0 0 60px rgba(255,20,147,0.7),
                             0 0 80px rgba(255,20,147,0.4);
            }
        }

        @media (max-width: 768px) {
            .stopwatch-display {
                font-size: 36px;
                letter-spacing: 2px;
            }
        }

        /* Home Button */
        .home-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255,20,147,0.2);
            border: 2px solid #ff1493;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(255,20,147,0.3);
        }

        .home-button:hover {
            background: rgba(255,20,147,0.4);
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255,20,147,0.6);
        }

        .home-button svg {
            width: 28px;
            height: 28px;
            fill: #ff1493;
            filter: drop-shadow(0 0 5px rgba(255,20,147,0.8));
        }

        @media (max-width: 768px) {
            .home-button {
                width: 45px;
                height: 45px;
                top: 15px;
                left: 15px;
            }
            .home-button svg {
                width: 24px;
                height: 24px;
            }
        }

        @media (max-width: 768px) {
            .card { padding: 32px 24px; }
            h1 { font-size: 24px; }
            .button-group { grid-template-columns: 1fr; }
        }
    </style>
<link rel="stylesheet" href="../../css/course-language.css">
</head>
<body>
<div class="course-lang-floating"><nav class="course-lang-switch" aria-label="اختيار اللغة"><a href="../../pairing/admin.html?lang=he" lang="he" data-course-language="he">עברית</a><span class="lang-separator" aria-hidden="true">|</span><a href="admin.html?lang=ar" lang="ar" data-course-language="ar" aria-current="true">العربية</a></nav></div>
    <!-- Home Button -->
    <a href="../strongermenu-2026.html" class="home-button" title="العودة إلى الصفحة الرئيسية">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
    </a>

    <div class="container">
        <div class="card">
            <!-- מסך הגדרות ראשוני -->
            <div class="setup-screen" id="setupScreen">
                <h1>🎯 إدارة النشاط</h1>
                
                <div class="form-group">
                    <label for="instructorCode">رمز المرشدة *</label>
                    <input type="password" id="instructorCode" placeholder="أدخلي رمز المرشدة..." autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="participantCount">عدد المشاركات *</label>
                    <input type="number" id="participantCount" min="1" placeholder="كم عدد المشاركات؟" autocomplete="off">
                </div>

                <button onclick="startActivity()">ابدئي النشاط</button>
                <div class="error" id="setupError"></div>
            </div>

            <!-- מסך מעקב -->
            <div class="tracking-screen" id="trackingScreen">
                <h1>📊 متابعة مباشرة</h1>
                
                <!-- שעון עצר -->
                <div class="stopwatch-container">
                    <div class="stopwatch-label">⏱️ وقت النشاط</div>
                    <div class="stopwatch-display" id="stopwatchDisplay">00:00:00</div>
                </div>
                
                <div class="stats">
                    <h2 id="progressText">0 / 0</h2>
                    <p style="color: #ff69b4;">استبيانات مكتملة</p>
                    
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                    </div>
                    
                    <p style="color: #aaa; font-size: 18px;" id="percentText">0%</p>
                    <p class="timer" id="timerText">التحديث القادم بعد 45 ثانية</p>
                </div>

                <div class="button-group">
                    <button class="secondary-btn" onclick="updateCount()">تحديث العدد</button>
                    <button class="secondary-btn" onclick="resetActivity()">إعادة ضبط النشاط</button>
                </div>

                <!-- כפתור חלוקה לالمجموعات - מופיע רק כאשר הכל הושלם -->
                <div class="button-group" id="matchingButtonContainer" style="display: none; margin-top: 20px;">
                    <button onclick="goToMatching()" style="background: linear-gradient(135deg, #ff1493, #ff69b4); font-size: 18px; font-weight: 700; padding: 18px 32px;">💝 اعرضي توزيع المجموعات</button>
                </div>

                <div class="success-message" id="successMessage">
                    🎉 اكتملت جميع الاستبيانات! رائع!
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Firestore -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCFSq5b-HgkTxFNhBJIBdOe2ian5TZvMPE",
            authDomain: "portzot-derech.firebaseapp.com",
            projectId: "portzot-derech",
            storageBucket: "portzot-derech.firebasestorage.app",
            messagingSenderId: "236417614890",
            appId: "1:236417614890:web:587b0eb3c5eedfa352af53"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        db._settings.experimentalForceLongPolling = true;
        console.log("✅ Firestore connection: OK");

        const adminDraftKey = 'portzot-pairing-admin-v1';
        let adminDraft = {};
        try { adminDraft = JSON.parse(sessionStorage.getItem(adminDraftKey)) || {}; } catch (_) {}
        let currentSessionId = adminDraft.sessionId || null;
        let refreshInterval = null;
        let timerInterval = null;
        let nextRefreshTime = 45;
        let unsubscribe = null;

        // שעון עצר
        let stopwatchInterval = null;
        let stopwatchStartTime = null;
        let stopwatchElapsed = adminDraft.elapsed || 0;
        window.addEventListener('pagehide', () => {
            try { sessionStorage.setItem(adminDraftKey, JSON.stringify({ sessionId: currentSessionId, elapsed: stopwatchElapsed, running: !!stopwatchInterval, savedAt: Date.now(), instructorCode: document.getElementById('instructorCode').value, participantCount: document.getElementById('participantCount').value })); } catch (_) {}
        });

        function startStopwatch() {
            stopwatchStartTime = Date.now() - stopwatchElapsed;
            stopwatchInterval = setInterval(updateStopwatch, 100);
        }

        function updateStopwatch() {
            stopwatchElapsed = Date.now() - stopwatchStartTime;
            const hours = Math.floor(stopwatchElapsed / 3600000);
            const minutes = Math.floor((stopwatchElapsed % 3600000) / 60000);
            const seconds = Math.floor((stopwatchElapsed % 60000) / 1000);
            
            const display = 
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0');
            
            document.getElementById('stopwatchDisplay').textContent = display;
        }

        function stopStopwatch() {
            if (stopwatchInterval) {
                clearInterval(stopwatchInterval);
                stopwatchInterval = null;
            }
        }

        function resetStopwatch() {
            stopStopwatch();
            stopwatchElapsed = 0;
            document.getElementById('stopwatchDisplay').textContent = '00:00:00';
        }

        window.startActivity = async function() {
            const instructorCode = document.getElementById('instructorCode').value.trim();
            const participantCount = parseInt(document.getElementById('participantCount').value);

            if (!instructorCode || !participantCount) {
                showError('setupError', 'يرجى ملء جميع الحقول');
                return;
            }

            try {
                // בדיקה שקוד המדריכה קיים ב-Firestore
                const instructorRef = doc(db, 'instructors', instructorCode);
                const instructorSnap = await getDoc(instructorRef);

                if (!instructorSnap.exists()) {
                    showError('setupError', 'رمز المرشدة غير صحيح. حاولي مجدّدًا.');
                    return;
                }

                // יצירת session חדש مع קוד מוסתר
                currentSessionId = 's_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                
                const sessionData = {
                    instructorCode: instructorCode,
                    participantCount: participantCount,
                    completedCount: 0,
                    isActive: true,
                    status: 'active',
                    createdAt: new Date().toISOString(),
                    expiresAt: new Date(Date.now() + 15 * 60 * 1000).toISOString()  // +15 דקות ⏰
                };

                await setDoc(doc(db, 'sessions', currentSessionId), sessionData);

                // מעבר למסך מעקב
                document.getElementById('setupScreen').style.display = 'none';
                document.getElementById('trackingScreen').classList.add('active');

                // התחלת שעון עצר ⚡
                startStopwatch();

                // התחלת מעקב
                startTracking();

                // איפוס שדות (אבל לא לשמור במשתנים גלובליים!)
                document.getElementById('instructorCode').value = '';
                document.getElementById('participantCount').value = '';

            } catch (error) {
                console.error('Error:', error);
                showError('setupError', 'حدث خطأ في إنشاء النشاط. حاولي مجدّدًا.');
            }
        };

        function startTracking() {
            if (!currentSessionId) return;

            const sessionRef = doc(db, 'sessions', currentSessionId);

            // מעקב בזמן אמת
            unsubscribe = onSnapshot(sessionRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    updateDisplay(data.completedCount, data.participantCount);
                }
            }, (error) => {
                console.error('Snapshot error:', error);
            });

            // התחלת טיימר רענון
            startRefreshTimer();
        }

        function updateDisplay(completed, total) {
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            document.getElementById('progressText').textContent = `${completed} / ${total}`;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('percentText').textContent = percent + '%';

            if (completed >= total && total > 0) {
                document.getElementById('successMessage').classList.add('show');
                document.getElementById('matchingButtonContainer').style.display = 'block'; // הצגת כפתור חלוקה לالمجموعات 💝
                stopRefreshTimer();
                stopStopwatch(); // עצירת שעון כשכולם סיימו ✅
            }
        }

        function startRefreshTimer() {
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                nextRefreshTime--;
                updateTimerDisplay();

                if (nextRefreshTime <= 0) {
                    // קביעת זמן הרענון הבא
                    const sessionRef = doc(db, 'sessions', currentSessionId);
                    getDoc(sessionRef).then(docSnap => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            const completed = data.completedCount;
                            const total = data.participantCount;
                            const percent = (completed / total) * 100;

                            if (percent >= 80) nextRefreshTime = 10;
                            else if (percent >= 60) nextRefreshTime = 15;
                            else if (percent >= 40) nextRefreshTime = 30;
                            else nextRefreshTime = 45;

                            if (completed >= total) {
                                stopRefreshTimer();
                            }
                        }
                    });
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            if (nextRefreshTime > 0) {
                document.getElementById('timerText').textContent = `التحديث القادم بعد ${nextRefreshTime} ثانية`;
            } else {
                document.getElementById('timerText').textContent = 'جارٍ التحديث...';
            }
        }

        function stopRefreshTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById('timerText').textContent = '✅ اكتمل كلّ شيء!';
        }

        window.updateCount = async function() {
            const newCount = prompt('العدد الجديد للمشاركات:');
            if (!newCount || isNaN(newCount)) return;

            try {
                const sessionRef = doc(db, 'sessions', currentSessionId);
                await updateDoc(sessionRef, {
                    participantCount: parseInt(newCount)
                });
                alert('✅ تمّ تحديث العدد بنجاح!');
            } catch (error) {
                console.error('Error:', error);
                alert('حدث خطأ في تحديث العدد');
            }
        };

        window.resetActivity = async function() {
            if (!confirm('هل أنتِ متأكّدة من رغبتكِ في إعادة ضبط النشاط؟')) return;

            try {
                if (unsubscribe) unsubscribe();
                stopRefreshTimer();
                resetStopwatch(); // איפוס שעון 🔄

                if (currentSessionId) {
                    const sessionRef = doc(db, 'sessions', currentSessionId);
                    // שינוי סטטוס במקום מחיקה ✅
                    await updateDoc(sessionRef, {
                        isActive: false,
                        status: 'completed',
                        endedAt: new Date().toISOString()
                    });
                }

                currentSessionId = null;
                document.getElementById('trackingScreen').classList.remove('active');
                document.getElementById('setupScreen').style.display = 'block';
                document.getElementById('successMessage').classList.remove('show');
                document.getElementById('matchingButtonContainer').style.display = 'none'; // הסתרת כפתור חלוקה לالمجموعات 💝
                
                alert('✅ أُعيد ضبط النشاط بنجاح!');
            } catch (error) {
                console.error('Error:', error);
                alert('حدث خطأ في إعادة ضبط النشاط');
            }
        };

        // פונקציה למעבר למסך החלוקה לالمجموعات 💝
        window.goToMatching = function() {
            if (!currentSessionId) {
                alert('خطأ: لم يُعثر على لقاء نشط');
                return;
            }
            
            console.log('🚀 الانتقال إلى شاشة توزيع المجموعات للقاء:', currentSessionId);
            window.location.href = `matching.html?session=${currentSessionId}`;
        };

        if (currentSessionId) {
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('trackingScreen').classList.add('active');
            if (adminDraft.running) {
                stopwatchElapsed += Math.max(0, Date.now() - (adminDraft.savedAt || Date.now()));
                startStopwatch();
            } else updateStopwatchFromDraft();
            startTracking();
        } else {
            document.getElementById('instructorCode').value = adminDraft.instructorCode || '';
            document.getElementById('participantCount').value = adminDraft.participantCount || '';
        }
        function updateStopwatchFromDraft() {
            stopwatchStartTime = Date.now() - stopwatchElapsed;
            updateStopwatch();
        }
        function showError(elementId, message) {
            const errorDiv = document.getElementById(elementId);
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }
    </script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
      navigator.serviceWorker.register("../../service-worker.js").catch(function(error) {
        console.error("Service worker registration failed:", error);
      });
    });
  }
</script>

</body>

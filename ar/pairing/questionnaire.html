      { label: 'أن أبدأ بسرعة وأحسّن في أثناء العمل.', code: 'prototype_fast' },
      { label: 'أن أفهم الهدف أوّلًا.', code: 'goal_first' },
      { label: 'أن أرى مثالًا ثمّ أجرّب.', code: 'example_based' },
      { label: 'أن أتحدّث مع المجموعة ونحدّد اتّجاهًا.', code: 'collaborative_direction' },
      { label: 'أن نوزّع المهامّ ونبدأ العمل.', code: 'task_execution' },
      { label: 'أن أبحث عن أفكار قبل أن نقرّر.', code: 'inspiration_research' }
    ]
  }
];

const draftKey = 'portzot-pairing-draft-v1:' + sessionId;
let draft = {};
try { draft = JSON.parse(sessionStorage.getItem(draftKey)) || {}; } catch (_) {}
const answers = {};
const codes = draft.codes || {};
if (typeof draft.displayName === 'string') answers.displayName = draft.displayName;
questions.forEach(q => {
  const option = q.options.find(o => o.code === codes[q.field]);
  if (option) answers[q.field] = option.label;
});
let step = Number.isInteger(draft.step) ? Math.max(0, Math.min(draft.step, questions.length - 1)) : 0;
function saveDraft() {
  try { sessionStorage.setItem(draftKey, JSON.stringify({ codes, responseId: draft.responseId, displayName: textAnswer.style.display !== 'none' ? textAnswer.value : answers.displayName, step })); } catch (_) {}
}
window.addEventListener('pagehide', saveDraft);

const eyebrowEl = document.getElementById('eyebrow');
const questionText = document.getElementById('questionText');
const optionsEl = document.getElementById('options');
const textAnswer = document.getElementById('textAnswer');
const hint = document.getElementById('hint');
const stepLabel = document.getElementById('stepLabel');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');

function renderQuestion() {
  const q = questions[step];
  eyebrowEl.textContent = q.eyebrow;
  questionText.textContent = q.text;
  stepLabel.textContent = 'السؤال ' + (step + 1) + ' من ' + questions.length;
  const progress = Math.round(((step + 1) / questions.length) * 100);
  progressText.textContent = progress + '%';
  progressFill.style.width = progress + '%';
  hint.textContent = '';
  backBtn.disabled = step === 0;
  nextBtn.textContent = step === questions.length - 1 ? 'انتهيتُ — يمكننا المتابعة 💜' : 'إلى الأمام';

  if (!q.options.length) {
    textAnswer.style.display = 'block';
    optionsEl.style.display = 'none';
    textAnswer.value = answers[q.field] || '';
    textAnswer.focus();
    return;
  }

  textAnswer.style.display = 'none';
  optionsEl.style.display = 'grid';
  optionsEl.innerHTML = '';
  q.options.forEach(function(opt) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option-btn' + (answers[q.field] === opt.label ? ' active' : '');
    btn.textContent = opt.label;
    btn.dataset.label = opt.label;
    btn.dataset.code = opt.code;
    optionsEl.appendChild(btn);
  });
}

optionsEl.addEventListener('click', function(e) {
  var btn = e.target.closest('.option-btn');
  if (!btn) return;
  var q = questions[step];
  answers[q.field] = btn.dataset.label;
  codes[q.field] = btn.dataset.code;
  saveDraft();
  renderQuestion();
});

backBtn.addEventListener('click', function() {
  if (step > 0) { step--; saveDraft(); renderQuestion(); }
});

nextBtn.addEventListener('click', async function() {
  var q = questions[step];
  if (q.field === 'displayName') {
    var v = textAnswer.value.trim();
    if (!v) { hint.textContent = 'لحظة، عليكِ اختيار شيء قبل أن نتابع 🙂'; return; }
    answers[q.field] = v;
  }
  if (!answers[q.field]) { hint.textContent = 'لحظة، عليكِ اختيار شيء قبل أن نتابع 🙂'; return; }
  if (step < questions.length - 1) { step++; saveDraft(); renderQuestion(); return; }

  nextBtn.disabled = true;
  saveDraft();
  var p = { id: draft.responseId || crypto.randomUUID(), sessionId: sessionId, submittedAt: new Date().toISOString() };
  draft.responseId = p.id;
  saveDraft();
  window.courseLanguageBusy = true;
  for (var i = 0; i < questions.length; i++) {
    var field = questions[i].field;
    p[field] = answers[field];
    if (field !== 'displayName') p[field + 'Code'] = codes[field] || answers[field];
  }
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('savingMessage').style.display = 'block';
  try {
  await setDoc(doc(db, 'responses', p.id), p);
  await updateDoc(doc(db, 'sessions', sessionId), { completedCount: increment(1) });
  localStorage.setItem('displayName', p.displayName);
  localStorage.setItem('responseId', p.id);
  sessionStorage.removeItem(draftKey);
  window.removeEventListener('pagehide', saveDraft);
  setTimeout(function() { location.href = 'waiting.html?session=' + sessionId; }, 700);
  } catch (error) {
    document.getElementById('questionCard').style.display = '';
    document.getElementById('savingMessage').style.display = 'none';
    hint.textContent = 'تعذّر الحفظ. تحقّقي من الاتّصال وحاولي مجدّدًا.';
    nextBtn.disabled = false;
    window.courseLanguageBusy = false;
  }
});

textAnswer.addEventListener('input', saveDraft);
renderQuestion();
</script>
</body>
</html>

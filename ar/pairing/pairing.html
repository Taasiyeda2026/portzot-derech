<html lang="ar" dir="rtl"><head>
<script src="../../js/course-language.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>شريكة الطريق – اختيار مجموعات العمل | פורצות דרך</title><link rel="icon" href="../../icon/favicon.png"><link rel="stylesheet" href="../../css/course-language.css?v=2027-2">
<style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:16px;font-family:"Segoe UI",Tahoma,sans-serif;color:white;background:radial-gradient(ellipse at top,#46132e,#170812 65%)}main{width:min(440px,100%);text-align:center}.logo{display:block;width:auto;height:clamp(70px,22vh,145px);max-width:100%;object-fit:contain;margin:0 auto 12px}.card{border:1px solid #a23d76;border-radius:20px;background:#ffffff0d;padding:clamp(14px,3vw,26px)}h1{font-size:clamp(22px,4vw,29px);line-height:1.25;margin:0 0 12px;color:#ff80c4}p{font-size:16px;line-height:1.5;margin:0 0 16px}button{font:inherit;font-weight:700;background:#c92b7d;color:white;border:0;border-radius:12px;padding:12px 26px;cursor:pointer}button:disabled{opacity:.6}#notice{margin:10px 0 0;font-size:14px}nav.course-lang-switch{display:inline-flex;justify-content:center;margin-bottom:6px;zoom:.5}#notice:empty{display:none}</style>
</head><body><main><nav class="course-lang-switch" aria-label="اختيار اللغة"><a href="../../pairing/pairing.html?lang=he" data-course-language="he" lang="he">עברית</a><span aria-hidden="true">|</span><a href="../../ar/pairing/pairing.html?lang=ar" data-course-language="ar" lang="ar">العربية</a></nav><img class="logo" src="../../icon/logo.png" alt="פורצות דרך" translate="no"><section class="card"><h1>شريكة الطريق – اختيار مجموعات العمل</h1><button id="start" type="button">بدء النشاط</button><p id="notice" role="status" aria-live="polite"></p></section></main>
<script type="module">
import {dashboardLogin,api} from '../../pairing/common.js';
const room=new URLSearchParams(location.search).get('room');
const target=new URL('../../pairing/admin.html',location.href);
if(room&&/^[0-9a-f]{32}$/.test(room)){const url=new URL('../../pairing/questionnaire.html',location.href);url.searchParams.set('room',room);url.searchParams.set('lang','ar');location.replace(url.href);}
else {const button=document.querySelector('#start'),notice=document.querySelector('#notice');button.addEventListener('click',async()=>{button.disabled=true;notice.textContent='';try{await dashboardLogin();await api('teacher.me');location.assign(target.href);}catch(error){notice.textContent="تعذّر تسجيل الدخول. حاولي مجددًا عبر لوحة التحكّم."||error.message;button.disabled=false;}});}
</script></body></html>
